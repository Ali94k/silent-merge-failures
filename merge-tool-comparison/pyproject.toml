[project]
name = "merge-tool-comparison"
version = "0.1.0"
description = "Framework for comparing Git merge tools on real-world Java merge scenarios"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "gitpython>=3.1",
    "tree-sitter>=0.21,<1.0",
    "tree-sitter-java>=0.21,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
viz = ["matplotlib>=3.8"]

[project.scripts]
merge-compare = "src.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
