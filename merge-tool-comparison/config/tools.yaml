tools:
  - name: git-merge-file
    adapter: git_merge_file
    docker_image: null  # runs natively
    timeout: 30
    enabled: true

  - name: jdime
    adapter: jdime
    docker_image: merge-tools/jdime
    timeout: 120
    enabled: true

  - name: spork
    adapter: spork
    docker_image: merge-tools/spork
    timeout: 120
    enabled: true

  - name: mastery
    adapter: mastery
    docker_image: merge-tools/mastery
    timeout: 120
    enabled: true

  # Driver backends (CLAUDE.md: comparator tracks the driver's tools).
  - name: mergiraf
    adapter: mergiraf
    docker_image: merge-tools/mergiraf:0.17.0
    timeout: 120
    enabled: true

  - name: weave
    adapter: weave
    docker_image: merge-tools/weave:0.3.2
    timeout: 120
    enabled: true
