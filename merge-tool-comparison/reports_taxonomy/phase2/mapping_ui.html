<style>
  :root{--red-bg:#fdecec;--red-tx:#8f1d1d;--grn-bg:#e9f6ec;--grn-tx:#1d5c2e;
        --amb-bg:#fdf3df;--amb-tx:#7a5410;--mut:#6b7280;--bd:#d6d3cd;

  button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--bd);border-radius:7px;background:#fff;cursor:pointer;}

  .card{border:1px solid var(--bd);border-radius:9px;padding:10px 13px;margin:8px 0;background:#fff;}

  .anchor{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:7px 0;background:#fff;}

<script>
const CATS=[{"id":"import-pruning-vs-concurrent-usage","name":"Import pruning vs. concurrent use","mechanism":"One side deletes or narrows an import (dead-import cleanup, wildcard narrowing, import migration) while the other side adds or retains code that resolves a symbol only through that import; the merge honors both, leaving a use with no import in scope.","definition":"The declaration itself is unchanged and still exists in the project or its dependencies. Only the *resolution path* \u2014 the import statement \u2014 was removed by one side, invalidated by the other side's new or retained usage.","inclusion":"The fix requires only restoring (or adding) an import line; the referenced declaration exists unmodified under its original name, package, and signature. Covers explicit-import deletion, static-import deletion, and wildcard\u2192explicit narrowing. Also covers resolution *shifts* where the pruned import causes the name to bind to a different same-named type.","exclusion":"If the declaration itself was deleted \u2192 `stale-reference-to-removed-declaration`. If the declaration moved package or was renamed (so no import of the old path could fix it) \u2192 `stale-reference-to-renamed-or-relocated-declaration`.","boundary":"Nearest neighbor is `stale-reference-to-removed-declaration`: here the symbol still exists and only its import was pruned; there the symbol itself is gone.","anchors":[{"unit_id":"apache_commons-collections__84e70353ad","note":"tag \"stale-import-deletion\"","in_derivation":true,"verdict":"attributed","summary":"Ours adds a new test method that calls fail(...); theirs deletes the fail static import because it removed every other fail usage. The clean merge keeps ours' new fail() calls but adopts theirs' deletion of the fail import, leaving fail() as an unresolved symbol and breaking compilation of the test sources.","tags":["added-usage-of-removed-import","stale-import-deletion","compile-break-from-import-removal"],"interaction_point":"CollectionUtilsTest.java static import of Assertions.fail vs. ours' new testPartitionByChunkSize body calling fail(...)"},{"unit_id":"jnr_jnr-unixsocket__467698b6bd","note":"tag \"import-narrowing-breaks-new-usage\"","in_derivation":true,"verdict":"attributed","summary":"Ours narrowed `import jnr.ffi.*;` to a handful of explicit imports (none of which is Struct or Pointer). Theirs added a getsockopt overload whose body uses `Struct` and `Pointer`, which only resolved under the original wildcard import. The clean merge kept ours' narrowed imports and theirs' new method, so `Struct`/`Pointer` become unresolved symbols and Native.java fails to compile, failing the whole suite.","tags":["import-narrowing-breaks-new-usage","wildcard-import-removal","unresolved-symbol-after-merge"],"interaction_point":"Native.java import block vs. theirs' new getsockopt(...,Struct data) method referencing Struct and Pointer"},{"unit_id":"feroult_yawp__141f79a8e9","note":"tag \"unused-import-removal-vs-new-usage\"","in_derivation":true,"verdict":"attributed","summary":"Ours deletes the java.util.List and java.util.ArrayList imports as dead-import cleanup, while theirs simultaneously adds a new method that uses both List and ArrayList. The clean merge keeps ours' import deletion AND theirs' usage, so the merged file references List/ArrayList with no import in scope \u2014 an unresolved-symbol compile error that breaks the build/test suite.","tags":["unused-import-removal-vs-new-usage","import-removed-symbol-reintroduced","clean-merge-compile-break"],"interaction_point":"Import block of IdRef.java vs. the new theirs-added varargs create(...) method body that references List and ArrayList."}],"provisional":false},{"id":"stale-reference-to-removed-declaration","name":"Removed declaration, live reference","mechanism":"One side deletes a declaration (field, method, constructor overload, inner class, interface clause, or dependency API), while the other side adds \u2014 or, via a delete/modify resolution, retains \u2014 code bound to it; the merge keeps the reference but not the declaration.","definition":"The referenced program element no longer exists in the merged result under any name. The reference was introduced or preserved by the other side without knowledge of the removal.","inclusion":"The declaration is gone entirely (including removal by a dependency upgrade one side adopted); no successor declaration exists under a new name that a rename-fix could target. Includes orphaned `@Override`s against a removed supertype contract and delete/modify conflicts where the tool kept the deleted-side-referencing code.","exclusion":"If a successor exists under a new name or package \u2192 `stale-reference-to-renamed-or-relocated-declaration`. If a same-named declaration remains with a different arity/type/contract \u2192 `stale-caller-of-changed-signature`. If only an import line was removed \u2192 `import-pruning-vs-concurrent-usage`.","boundary":"vs. `stale-reference-to-renamed-or-relocated-declaration`: decide by whether the merged codebase contains a successor declaration (rename/move) or nothing at all (removal).","anchors":[{"unit_id":"datastax_java-driver__e1535e89ad","note":"tag \"stale-reference-to-removed-field\"","in_derivation":true,"verdict":"attributed","summary":"Ours deleted the `isShutdown` AtomicBoolean field (converting it into a method `isShutdown()`), while theirs added brand-new code that reads that field via `isShutdown.get()`. The clean merge keeps both, so the merged file references a field that no longer exists \u2014 an unresolvable symbol that breaks compilation of the module and thus the whole test suite.","tags":["stale-reference-to-removed-field","field-replaced-with-method","semantic-merge-incompatibility"],"interaction_point":"borrowConnection(...) \u2014 the theirs-added `if (isShutdown.get())` guard referencing the field that ours removed"},{"unit_id":"jcabi_jcabi-github__b13d2596ba","note":"tag \"deleted-method-with-new-callers\"","in_derivation":true,"verdict":"attributed","summary":"OURS deleted the private static `milestones()` helper method, while THEIRS added new test-method bodies (iteratesIssues, createsNewMilestone) that call `milestones()`. The clean merge keeps THEIRS's callers but removes the method OURS deleted, leaving dangling references to a non-existent `milestones()` method \u2014 an unresolvable symbol that breaks compilation of the test class.","tags":["deleted-method-with-new-callers","stale-caller-of-removed-helper","refactor-vs-feature-collision"],"interaction_point":"RtMilestonesITCase private static Milestones milestones() helper and its callers in iteratesIssues()/createsNewMilestone()"},{"unit_id":"yandex-qatools_postgresql-embedded__6e15a53c7e","note":"tag \"deleted-field-still-written\"","in_derivation":true,"verdict":"attributed","summary":"Ours deleted the `processReady` field (and its `isProcessReady()` accessor) as part of a cleanup, while theirs added a new write `this.processReady = true;` to that same field. The clean merge keeps theirs' assignment but loses ours' field declaration, leaving a reference to an undefined member and breaking compilation of the whole module, so every test fails.","tags":["deleted-field-still-written","use-after-removal","refactor-vs-feature-collision"],"interaction_point":"PostgresProcess.java \u2014 the `processReady` field / its write in onAfterProcessStart"}],"provisional":false},{"id":"stale-reference-to-renamed-or-relocated-declaration","name":"Rename/relocation vs. old-name reference","mechanism":"One side renames or relocates a declaration (field, parameter, method, class, package, or namespace) and updates the references it can see; the other side adds code bound to the old name or old location, which the merge keeps verbatim.","definition":"The declaration survives under a new identity (new identifier, new package, new namespace, new method name). The other side's new code references the pre-rename identity, producing a reference that no longer binds.","inclusion":"A one-to-one successor declaration exists; the fix is to redirect the stale reference to the new name/location. Covers identifier renames, parameter renames inside a method one side extended, package moves that defeat wildcard resolution, javax\u2192jakarta-style namespace migrations, and API renames performed as call-site migrations (e.g., `setCamera` \u2192 `setProperty`).","exclusion":"No successor exists \u2192 `stale-reference-to-removed-declaration`. Name unchanged but contract changed \u2192 `stale-caller-of-changed-signature`. Rename entangled with a concurrent restructuring of the *same* code region (producing a hybrid) \u2192 `overlapping-edit-interleaving`.","boundary":"vs. `stale-caller-of-changed-signature`: rename changes *what the thing is called*; signature change keeps the name but alters what a use of it must look like.","anchors":[{"unit_id":"jline_jline2__5acfe59453","note":"tag \"field-rename-vs-added-caller\"","in_derivation":true,"verdict":"attributed","summary":"Ours renamed the field `nonBlockingInput` to `in` throughout ConsoleReader, while theirs introduced a brand-new method insertClose() that calls `nonBlockingInput.isNonBlockingEnabled()` / `nonBlockingInput.peek(...)`. The clean merge keeps theirs' new method verbatim but the field it names no longer exists, so the merged file references an undefined symbol and fails to compile, breaking the whole test build.","tags":["stale-reference-to-renamed-field","field-rename-vs-added-caller","clean-merge-compile-break"],"interaction_point":"ConsoleReader.insertClose() referencing the field renamed by ours (nonBlockingInput -> in)"},{"unit_id":"gitools_gitools__02221bf3d8","note":"tag \"stale-import-after-package-rename\"","in_derivation":true,"verdict":"attributed","summary":"OURS moved the matrix model classes into the org.gitools.core.matrix.model package; THEIRS, written against the base layout, introduced a new import 'org.gitools.matrix.model.IMatrixViewDimension' referencing the pre-rename package. The clean merge keeps THEIRS's stale import verbatim, so after OURS's rename that package no longer exists and the file fails to resolve.","tags":["stale-import-after-package-rename","import-namespace-conflict"],"interaction_point":"HeatmapKeyboardController.java import of IMatrixViewDimension"},{"unit_id":"imixs_imixs-workflow__23b86de5b4","note":"tag \"namespace-migration-vs-new-javax-import\"","in_derivation":true,"verdict":"attributed","summary":"Ours performed a wholesale javax\u2192jakarta namespace migration while theirs introduced a brand-new dependency on javax.ejb.AccessTimeout (import + annotation) written against the old base namespace. The clean merge combined both, leaving a stale `import javax.ejb.AccessTimeout;` and `@AccessTimeout` in a codebase whose EE APIs are now jakarta-only, so the javax.ejb package no longer resolves and the module fails to compile.","tags":["namespace-migration-vs-new-javax-import","stale-import-after-package-rename","incompatible-ee-namespace-mix"],"interaction_point":"LuceneUpdateService.java import block / @AccessTimeout annotation"}],"provisional":false},{"id":"stale-caller-of-changed-signature","name":"Changed signature/type contract vs. old-contract code","mechanism":"One side changes a declaration's static contract \u2014 arity, parameter types, return type, generic bounds, throws clause, or field type (including contract changes adopted via a dependency-version migration) \u2014 and updates all uses it can see; the other side adds code (callers, stubs, overloads, return sites, accessors) written against the old contract, which the merge keeps verbatim.","definition":"The name still resolves, but the interaction between the new-contract declaration and the old-contract use is statically ill-formed (wrong arity, incompatible types, violated bound, undeclared checked exception) or invalid under the migrated dependency.","inclusion":"A same-named declaration exists in the merged result and the other side's contribution uses it under its pre-change contract. Includes: arity changes (4\u21925 args), constructor-signature changes, Optional-return migrations, field retyping consumed by a new accessor, return-type changes meeting a new return statement, generic-bound divergence between concurrently edited overloads, throws-clause widening under new non-declaring callers, and framework/API-idiom migrations (e.g., Reactor `then(Function)`/`when` \u2192 `flatMap`/`zip`) where new code still uses the pre-migration idiom.","exclusion":"Symbol gone entirely \u2192 `stale-reference-to-removed-declaration`. Symbol renamed \u2192 `stale-reference-to-renamed-or-relocated-declaration`. Contract change is purely *behavioral* (compiles fine, breaks at runtime) \u2192 `changed-behavior-vs-stale-expectation`.","boundary":"vs. `changed-behavior-vs-stale-expectation`: this category breaks statically (binding/typing); that one composes cleanly at the type level and diverges only in runtime semantics.","anchors":[{"unit_id":"buddycloud_buddycloud-server-java__48e4675ee2","note":"tag \"stale-caller-of-changed-signature\"","in_derivation":true,"verdict":"attributed","summary":"Ours changed the getNodeItemReplies API from 4 to 5 arguments (adding the boolean `after` cursor) and updated every test stub accordingly. Theirs independently added a new test that stubs getNodeItemReplies with the old 4-argument signature. Merging both keeps theirs' new test verbatim, so it references a method arity that no longer exists, breaking the build/test.","tags":["stale-caller-of-changed-signature","concurrent-api-arity-change","new-test-against-removed-overload"],"interaction_point":"RepliesGetTest: theirs' new test rsmStillAddedWhenThereAreNoResults stubs getNodeItemReplies with the 4-arg signature that ours replaced with a 5-arg signature"},{"unit_id":"urbanairship_java-library__bbe0297a10","note":"tag \"new-test-uses-old-api\"","in_derivation":true,"verdict":"attributed","summary":"OURS changed the property value type across the codebase so that CustomEventBody.Builder.addAllPropertyEntries now takes Map<String,CustomEventPropValue> (evident from OURS converting every caller to CustomEventPropValue.of(...)). THEIRS independently added a new test method testNamedUserFullPayload that constructs properties as Map<String,String> and passes them to addAllPropertyEntries. Mergiraf combines both, yielding a test file whose new method calls the changed method with the old String map \u2014 a type mismatch that fails to compile, breaking the whole test module.","tags":["stale-caller-of-changed-signature","new-test-uses-old-api","type-signature-mismatch"],"interaction_point":"CustomEventPayloadSerializerTest.testNamedUserFullPayload \u2192 addAllPropertyEntries(properties) called with Map<String,String>"},{"unit_id":"winder_universal-g-code-sender__c93fec43ee","note":"tag \"return-type-change-vs-new-return-site\"","in_derivation":true,"verdict":"attributed","summary":"Ours changed getProcessor's return type from CommandProcessor to Optional<CommandProcessor>, wrapping all returns in Optional.of(). Theirs independently added a new case returning a bare `new EmptyLineRemoverProcessor()`. The clean merge grafts theirs' un-wrapped return into ours' Optional-typed method, producing `return new EmptyLineRemoverProcessor();` where an Optional<CommandProcessor> is required \u2014 an incompatible-type compile error.","tags":["return-type-change-vs-new-return-site","incompatible-type-merge","signature-refactor-collision"],"interaction_point":"getProcessor(ProcessorConfig) switch statement \u2014 the EmptyLineRemoverProcessor case return statement vs the method's return type"},{"unit_id":"cloudfoundry_cf-java-client__a9d35d542d","note":"tag \"stale-api-usage-in-added-code\"","in_derivation":true,"verdict":"attributed","summary":"Ours performed a wholesale Reactor migration converting .then(Function) usages to .flatMap(Function) (and .when to .zip). Theirs, branched from base, added new methods that still use the old .then(Function) overload. The clean merge kept theirs' new getServiceName body using .then(serviceInstanceId -> ...), which is invalid under the migrated Reactor API ours adopted, breaking compilation of the module (and hence the whole suite).","tags":["incomplete-api-migration","stale-api-usage-in-added-code","reactor-then-to-flatmap"],"interaction_point":"DefaultRoutes.getServiceName \u2014 the newly added .then(serviceInstanceId -> getServiceInstanceName(...)) call"}],"provisional":false},{"id":"changed-behavior-vs-stale-expectation","name":"Runtime-behavior change vs. dependent code","mechanism":"One side changes the runtime behavior or semantic model of a component (stricter validation, different output/identifier, retired type-discrimination model, rerouted or side-effecting execution path); the other side adds code, tests, guards, or fixtures that depend on the old behavior. The merged program is well-typed but semantically inconsistent.","definition":"Both contributions compile and each is correct against its own parent's semantics; their composition executes the new behavior against old-behavior assumptions, failing at runtime (thrown validation errors, failed assertions, skipped branches, corrupted state).","inclusion":"No name/type breakage; the interaction is between a behavioral contract one side changed and a dependence on the prior contract the other side introduced. Covers: new inputs that a concurrently tightened validator rejects; new tests/golden fixtures asserting outputs the other side changed; guards written against a type model the other side retired; new call routing that reaches behavior the other side rewrote.","exclusion":"Statically ill-formed interactions \u2192 `stale-caller-of-changed-signature` (or the removal/rename categories). Runtime inconsistency caused by weaving two rewrites of the *same region* \u2192 `overlapping-edit-interleaving`.","boundary":"vs. `overlapping-edit-interleaving`: here the two edits sit in *separate* regions and interact through execution; there both sides rewrote the *same* region and the merge wove a hybrid.","anchors":[{"unit_id":"jakewharton_disklrucache__7f28919d2a","note":"tag \"added-test-uses-newly-illegal-input\"","in_derivation":true,"verdict":"attributed","summary":"Theirs made key validation reject any key not matching [a-z0-9_]{1,64}, and diligently lowercased all keys in existing tests. Ours independently added three new tests that call set(\"A\",...) / cache.get(\"A\") with an uppercase key. After merge these new tests invoke validateKey(\"A\"), which now throws IllegalArgumentException because 'A' is not in [a-z0-9_], failing tests that neither parent would fail.","tags":["stricter-validation-vs-new-caller","incompatible-key-convention","added-test-uses-newly-illegal-input"],"interaction_point":"DiskLruCache.validateKey (LEGAL_KEY_PATTERN) invoked by edit()/get() for the uppercase key \"A\" used in the ours-side testAggressiveClearing* tests"},{"unit_id":"jenkinsci_coverity-plugin__62bdb6232e","note":"tag \"stale-test-expectation\"","in_derivation":true,"verdict":"attributed","summary":"Ours changed CoverityBuildAction so its URL name becomes `coverity_defects` (evidenced by ours rewriting both existing tests' URL assertions). Theirs independently added a new test asserting the OLD URL `coverity_cim-instance_test-project_test-stream`. The merge keeps ours' behavioral change together with theirs' new test, so that new test's `verifyMessages` assertion fails against the now-different URL.","tags":["stale-test-expectation","behavior-change-vs-new-test","semantic-conflict-clean-merge"],"interaction_point":"DefectReaderTest.getLatestDefectsForBuild_withOverOneThousandMatchingDefects \u2014 the `Coverity details:` URL assertion vs CoverityBuildAction.getUrlName()"},{"unit_id":"jsprit_jsprit__df2e3e4b7e","note":"tag \"stale-type-check-after-refactor\"","in_derivation":true,"verdict":"attributed","summary":"OURS is a refactor that retires DeliverShipment: shipment deliveries are now generic DeliveryActivity objects distinguished via AbstractActivity.isShipment(), which is why MaxDistanceConstraint's `instanceof DeliverShipment` had to become `instanceof DeliveryActivity && isShipment`. THEIRS independently added a shipment cost path and test that rely on `instanceof DeliverShipment` being true for a shipment's delivery activity. After the merge that guard is stale against OURS's unified activity model, so the shipment cost branch is skipped and the new assertion (cost==10) fails.","tags":["stale-type-check-after-refactor","deprecated-class-instanceof-drift","semantic-drift-in-guard"],"interaction_point":"LocalActivityInsertionCostsCalculator empty-route branch guard `newAct instanceof DeliverShipment` vs OURS's move to the DeliveryActivity+isShipment activity model"}],"provisional":false},{"id":"overlapping-edit-interleaving","name":"Divergent same-region edits woven into a hybrid","mechanism":"Both sides rewrote the same statement, expression, or block in divergent ways; the structured merge interleaved fragments of both rewrites into a hybrid that neither side wrote or intended.","definition":"The breakage is a composition artifact of fine-grained merging within one region: mixed identifiers from a rename vs. a restructuring, a call combining one side's receiver change with the other's method-name change, a declaration lost between a delete-for-move and adjacent edits, or a guard from one side silently negating the other side's generalization on one path.","inclusion":"Both parents modified overlapping lines/nodes of the same region, and the failure is attributable to the *combination* of fragments (compile-time or runtime), not to one side's declaration change meeting the other side's independent addition elsewhere.","exclusion":"One side's edit is a declaration-level change consumed by code the other side added in a *different* region \u2192 the removal/rename/signature categories. One side *moved* the region and the other's insertion traveled with it \u2192 `insertion-anchored-to-relocated-code`.","boundary":"vs. `insertion-anchored-to-relocated-code`: interleaving requires both sides to have *edited* the same region; anchored insertion is a placement error caused by one side moving code the other side inserted next to.","anchors":[{"unit_id":"openhft_chronicle-bytes__0fb20d3a47","note":"tag \"both-sides-edited-same-line\"","in_derivation":true,"verdict":"attributed","summary":"Both sides rewrote the exact same assertion line in different ways: ours changed the arguments to `src.toString()`/`dst.toString()`, theirs wrapped the raw `src`/`dst` in `assertTrue(BytesInternal.contentEqual(...))`. Mergiraf combined both edits into `assertTrue(BytesInternal.contentEqual(src.toString(), dst.toString()))`, feeding String arguments into a method designed for BytesStore, which is a type-incompatible / semantically wrong call the developer explicitly avoided.","tags":["overlapping-edit-combination","both-sides-edited-same-line","argument-type-mismatch-from-merge"],"interaction_point":"NativeBytesStoreTest.java, the copyTo assertion line (`assertEquals(src, dst)` region)"},{"unit_id":"jacquesberger_jsonparsingexample__ac521954c2","note":"tag \"inconsistent-identifier-merge\"","in_derivation":true,"verdict":"attributed","summary":"Ours extracted a helper but kept the name outputList; theirs renamed the same variable to bookTitleList in place. Mergiraf combined both edits line-by-line, producing methods that declare one name but reference the other: saveToFiles declares outputList yet calls saveAsRawJsonFile(bookTitleList), and initializeBookList declares bookTitleList yet does return outputList. Both are references to undefined local variables, so the merged code cannot compile.","tags":["variable-rename-vs-extract-method","inconsistent-identifier-merge","undefined-local-variable"],"interaction_point":"saveToFiles / initializeBookList local variable naming in JSON.java"},{"unit_id":"sailthru_sailthru-java-client__ee1f917600","note":"tag \"cross-side-api-incompatibility\"","in_derivation":true,"verdict":"attributed","summary":"Ours replaced java.util.logging with SLF4J (whose severity method is warn), while theirs renamed the call from info to warning (the java.util.logging severity method). The merge combined ours' SLF4J Logger instance with theirs' .warning() method name, producing a call to a method that does not exist on org.slf4j.Logger.","tags":["cross-side-api-incompatibility","logging-framework-swap-vs-method-rename","method-name-mismatch"],"interaction_point":"ApiException constructor logger call: logger.warning(\"{}: {}\", statusCode, reason)"},{"unit_id":"jdupl_lancoder__407742ea19","note":"tag \"moved-declaration-dropped\"","in_derivation":true,"verdict":"attributed","summary":"Both sides edited the same overlapping block that declared and positioned the local `ctxApi`. Theirs deleted the declaration from its original top location (intending to reinsert it below), while ours edited the surrounding lines (removing dead comments/blank lines) at the same spot. Mergiraf combined theirs' deletion with ours' edits and dropped the reinserted declaration, so the merged run() uses `ctxApi` in `contexts.setHandlers(new Handler[] { ctxStatic, ctxApi })` without ever declaring it \u2014 an unresolved symbol that breaks compilation and hence the whole test suite.","tags":["moved-declaration-dropped","both-sides-edited-same-block","dangling-reference-after-merge"],"interaction_point":"ApiServer.run(): declaration/placement of the local variable `ctxApi`"},{"unit_id":"blockchain_api-v1-client-java__e349598f95","note":"tag \"semantic-interleaving\"","in_derivation":true,"verdict":"attributed","summary":"Ours introduced an isEmpty-guarded GET branch that hardcodes BASE_URL; theirs parameterized openURL to use a caller-supplied baseURL. Mergiraf combined both, producing a branch where empty-params GET requests use BASE_URL (ours) while non-empty use baseURL (theirs), so the new custom-baseURL overload is silently ignored whenever params are empty.","tags":["variable-capture-inconsistency","parameter-refactor-vs-branch-guard","semantic-interleaving"],"interaction_point":"HttpClient.openURL(...) GET branch URL construction"}],"provisional":false},{"id":"insertion-anchored-to-relocated-code","name":"Insertion carried into relocated code","mechanism":"One side moves or extracts a block (e.g., into a new method); the other side inserts new statements anchored to that block; the merge places the insertion at the block's *new* location, where its scope, receiver variables, or execution frequency are wrong.","definition":"Each side's change is individually sound; the tool's anchoring transplants the insertion into a context (different local scope, different method, different call multiplicity) that invalidates it \u2014 unresolved locals after extraction, or code executing once-per-call instead of once.","inclusion":"Evidence that one side relocated/extracted a region and the other side's *new* statements were spliced into the relocated position, breaking scope resolution or execution placement.","exclusion":"Both sides rewriting the same region in place \u2192 `overlapping-edit-interleaving`. A moved *declaration* referenced by old-location code without any insertion-anchoring \u2192 the rename/relocation category.","boundary":"vs. `overlapping-edit-interleaving`: the failing code here is textually intact from one parent; only its *position* (and hence scope/frequency) is a merge artifact.","anchors":[{"unit_id":"comatoes_ftl-profile-editor__e87fe65818","note":"tag \"insertion-into-relocated-region\"","in_derivation":true,"verdict":"attributed","summary":"OURS extracted the tail of the parsing loop (augment/etc.) into a new readShip method whose only receiver is the local `shipState`, while THEIRS appended new statements (cargo, sector seed, beacons) that reference the local `gameState`. Mergiraf spliced THEIRS's new statements into the moved location inside readShip, where `gameState` is undefined, producing an unresolved-symbol compile error that breaks the whole build and hence the test suite.","tags":["code-block-moved-into-new-method","receiver-variable-out-of-scope","insertion-into-relocated-region","stale-reference-after-extraction"],"interaction_point":"readShip(...) method body \u2014 the `gameState` symbol referenced there is out of scope (only `shipState`/`in` exist)"},{"unit_id":"openpnp_openpnp__a43f3e919e","note":"tag \"insertion-anchored-to-moved-block\"","in_derivation":true,"verdict":"attributed","summary":"OURS appended its ACTUATOR_READ loop to findIssues immediately after the inline disallowHeadMountables block. THEIRS extracted that same disallowHeadMountables block into a new static suggestGcodeCommand method. Mergiraf anchored OURS's loop to the moved block, so in the merged result the loop became the last statement of suggestGcodeCommand instead of findIssues \u2014 meaning it now runs once per suggestGcodeCommand call (once per commandType) rather than once, generating duplicate ACTUATOR_READ deprecation issues and iterating/mutating gcodeDriver.commands repeatedly.","tags":["insertion-anchored-to-moved-block","extracted-method-misplacement","duplicate-issue-generation"],"interaction_point":"GcodeDriverSolutions.findIssues vs the newly-extracted static suggestGcodeCommand method \u2014 the placement of OURS's `for (Command command : gcodeDriver.commands)` loop relative to the disallowHeadMountables block THEIRS moved."}],"provisional":false},{"id":"duplicate-concurrent-addition","name":"Same addition on both sides, kept twice","mechanism":"Both sides independently added the same or equivalent element to the same target; the merge treated them as distinct insertions and kept both, producing an illegal or behavior-changing duplication.","definition":"Neither side changed anything the other depends on; the interaction is that two additions collide on a uniqueness constraint (non-repeatable annotation on one method, same registration key emitted twice).","inclusion":"The merged result contains two copies (or two same-target instances) of an element that must be unique, each traceable to one parent's addition.","exclusion":"Divergent (non-equivalent) rewrites of the same region \u2192 `overlapping-edit-interleaving`.","boundary":"vs. `overlapping-edit-interleaving`: here the two contributions are equivalent and the harm is their coexistence; there they are divergent and the harm is their fusion.","anchors":[{"unit_id":"kaazing_k3po__084cc0b426","note":"tag \"duplicate-nonrepeatable-annotation\"","in_derivation":true,"verdict":"attributed","summary":"Both sides added an @Ignore annotation (with different messages) to the same method shouldEchoFrameWithPayloadLength127. The clean merge stacked both annotations on the method, but org.junit.Ignore is not @Repeatable, so the merged file has a duplicate non-repeatable annotation, which does not compile and takes down the whole test module's compilation.","tags":["concurrent-annotation-addition","duplicate-nonrepeatable-annotation"],"interaction_point":"The @Ignore annotation stack on method shouldEchoFrameWithPayloadLength127"},{"unit_id":"stevespringett_dependency-check-sonar-plugin__03377193d3","note":"tag \"identical-addition-not-deduplicated\"","in_derivation":true,"verdict":"attributed","summary":"Both sides appended the exact same USE_FILEPATH PropertyDefinition block at the end of getPropertyDefinitions(). Mergiraf treated the two identical additions as distinct insertions and emitted the block twice, producing a duplicated PropertyDefinition (same key registered twice), which a test asserting the property-definition list (count or uniqueness) would reject. The developer removed the redundant copy.","tags":["duplicate-insertion-both-sides","identical-addition-not-deduplicated","duplicate-property-registration"],"interaction_point":"DependencyCheckConfiguration.getPropertyDefinitions() \u2014 the appended USE_FILEPATH PropertyDefinition.builder(...) block"}],"provisional":false},{"id":"residual-other","name":"Residual (attributed, unclassified)","mechanism":"A real, attributed two-sided interaction mechanism that fits none of the named categories.","definition":"Catch-all required by protocol: closed coding may not invent categories, so attributed units whose mechanism falls outside the set above land here. Assign only after all named categories' inclusion criteria have been checked and rejected.","inclusion":"Verdict = attributed, and no named category's inclusion criteria are met.","exclusion":"Any unit meeting a named category's criteria; any escape-hatch unit (those are the not-cleanly-attributable stratum, not residual).","boundary":"Not a home for escape-hatch units and not a home for hard-to-decide units between two named categories \u2014 those get the better-fitting named primary plus a secondary.","anchors":[],"provisional":false}], MAP=[{"num":"1","historical":"Atomic Updates (coupled state values violating an invariant)","counterpart":"**No empirical counterpart observed** among attributed units. No unit shows two concurrent value updates violating a shared invariant."},{"num":"2","historical":"Control Flow Interference (Short Circuit)","counterpart":"No standalone category. Partial counterparts absorbed into `overlapping-edit-interleaving` (a one-side guard branch negating the other side's generalization: `blockchain_api-v1-client-java__e349598f95`) and `changed-behavior-vs-stale-expectation` (new call routing reaching changed behavior: `sander2798_enderstone__9d0d7b7ba8`)."},{"num":"3","historical":"Data Flow Interference (Stale Read)","counterpart":"No standalone category. The nearest empirical phenomenon \u2014 dependence on data/output the other side changed \u2014 lives in `changed-behavior-vs-stale-expectation` (e.g., golden-fixture drift in `kongchen_swagger-maven-plugin__10c79c6df1`); no clear-a-collection-then-read case was observed."},{"num":"4","historical":"Exception Handling Divergence","counterpart":"Subsumed by `stale-caller-of-changed-signature`: the one observed case is a throws-clause widening meeting new non-declaring callers (`mercadopago_sdk-java__9dfc950fd2`), i.e., an exception-contract instance of the signature-change mechanism, not a catch-block interaction."},{"num":"5","historical":"Loop Semantics Divergence","counterpart":"**No empirical counterpart observed.** The only loop-multiplicity failure (`openpnp_openpnp__a43f3e919e`) is mechanistically an anchoring error (`insertion-anchored-to-relocated-code`), not an interaction of concurrent loop-semantics edits."},{"num":"6","historical":"Method Rename","counterpart":"Maps to `stale-reference-to-renamed-or-relocated-declaration`, with the empirical data splitting the old category three ways by what happened to the declaration: renamed/relocated (this category), deleted (`stale-reference-to-removed-declaration`), or re-signatured (`stale-caller-of-changed-signature`)."},{"num":"7","historical":"Scope Capture (Variable Shadowing)","counterpart":"No standalone category supported. Partial counterparts: resolution shift to a same-named type after import pruning (`ninjaframework_ninja__94b2365be3`, within `import-pruning-vs-concurrent-usage`) and scope loss after extraction (`comatoes_ftl-profile-editor__e87fe65818`, within `insertion-anchored-to-relocated-code`). No true variable-shadowing capture was observed."}], SIZES={"import-pruning-vs-concurrent-usage":15,"stale-reference-to-removed-declaration":9,"overlapping-edit-interleaving":5,"stale-caller-of-changed-signature":14,"stale-reference-to-renamed-or-relocated-declaration":7,"insertion-anchored-to-relocated-code":2,"changed-behavior-vs-stale-expectation":5,"duplicate-concurrent-addition":3}, FOURFAMILY="The empirical clusters do **not** line up cleanly with the candidate four-family regrouping, and we keep the empirical structure:\n\n- **Name-binding dominates overwhelmingly.** Four categories \u2014 `import-pruning-vs-concurrent-usage`, `stale-reference-to-removed-declaration`, `stale-reference-to-renamed-or-relocated-declaration`, `stale-caller-of-changed-signature` \u2014 are all name-binding/typing interactions and cover 45/60 attributed units (75%). Collapsing them into one \"name-binding\" family would destroy the distinction (removed vs. renamed vs. re-signatured vs. import-only) that makes closed coding decidable and that developers' fixes actually track.\n- **`changed-behavior-vs-stale-expectation` cuts across state, control-flow, and data-flow.** Its units include state-contract tightening (key validation), data drift (generated output vs. fixtures), and control rerouting into changed code. The empirical joint \u2014 \"one side changed runtime semantics, the other depended on the old semantics\" \u2014 is more decidable than which of the three families a given instance falls into, so we keep it whole.\n- **`overlapping-edit-interleaving` and `insertion-anchored-to-relocated-code` are merge-tool composition artifacts** that surface variously as name-binding breaks (mixed identifiers, dropped declaration), control-flow errors (mis-scoped loop), or data-flow errors (parameter silently ignored). They are defined by *how the tool combined edits*, not by which family the damage lands in; forcing them into the four families would split coherent mechanisms.\n- **`duplicate-concurrent-addition` fits none of the four families** and would fall to residual under that scheme despite being a crisp, recurrent mechanism.\n\nConclusion: the four-family lens is useful as a secondary descriptive axis, but as a primary category scheme it would lump three quarters of the data into one family and shear the tool-artifact categories apart. The codebook retains the empirical clusters.", META={"draft":"reports_taxonomy/phase2/codebook_draft.md","n_categories":9,"n_named":8,"n_mapping_rows":7,"attributed_covered":60};
const ACTIONS=[["ACCEPT","on-acc","keep as-is"],["RENAME","on-ren","new id/name"],
  ["EDIT","on-edit","adjust definition/criteria"],["MERGE","on-mrg","fold into another"],
  ["SPLIT","on-spl","break into >1"],["REJECT","on-rej","drop"]];
const LS="phase2-codebook-review-v1";
// screens = categories + [mapping/four-family] + [overall submit]
const N=CATS.length;
let st=CATS.map(()=>({action:null,note:"",new_id:"",merge_target:""}));
let extra={map_comment:"",ff_comment:"",overall:null,escape_ack:false,overall_note:""};
try{const s=JSON.parse(localStorage.getItem(LS)||"{}");
  if(s.st)CATS.forEach((c,i)=>{if(s.st[c.id])st[i]=s.st[c.id];});
  if(s.extra)extra=Object.assign(extra,s.extra);}catch(e){}
let cur=0;
function save(){const o={st:{},extra};CATS.forEach((c,i)=>o.st[c.id]=st[i]);localStorage.setItem(LS,JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function ruled(i){return st[i].action!=null;}

function renderList(){
  let h=CATS.map((c,i)=>{const s=st[i];
    return `<div class="sideItem ${cur===i?"cur":""}" onclick="go(${i})">
      <div class="id">${i+1}. ${esc(c.id)}</div>
      <div class="meta"><span class="dot ${ruled(i)?"done":""}"></span>
        <span class="chip c-att">${SIZES[c.id]||0} units</span>
        ${s.action?`<span class="chip c-inf">${s.action}</span>`:""}</div></div>`;}).join("");
  h+=`<div class="sideItem ${cur===N?"cur":""}" onclick="go(${N})">
      <div class="id">${N+1}. Old&rarr;new mapping &amp; four-family</div>
      <div class="meta"><span class="dot ${extra.map_comment||extra.ff_comment?"done":""}"></span></div></div>`;
  h+=`<div class="sideItem ${cur===N+1?"cur":""}" onclick="go(${N+1})">
      <div class="id">${N+2}. Overall ruling + submit</div>
      <div class="meta"><span class="dot ${extra.overall?"done":""}"></span>
        ${extra.overall?`<span class="chip ${extra.overall==="APPROVE"?"c-grn":"c-amb"}">${extra.overall}</span>`:""}</div></div>`;
  document.getElementById("list").innerHTML=h;
  const n=st.filter((_,i)=>ruled(i)).length;
  document.getElementById("prog").textContent=n+" / "+N+" cats";
  document.getElementById("barFill").style.width=Math.round(100*n/N)+"%";
}

function catScreen(){
  const c=CATS[cur],s=st[cur];
  let h=`<h2 class="id">${esc(c.id)}</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;">
      <span class="chip c-att">${SIZES[c.id]||0} attributed units</span>
      ${c.provisional?`<span class="chip c-amb">provisional</span>`:""}
      <span class="chip c-inf">${c.anchors.length} anchor(s)</span></div>`;
  // ruling controls
  h+=`<div class="labels"><span style="color:var(--mut);font-size:12px;">Ruling:</span>`+
     ACTIONS.map(([v,cls,tip])=>`<button title="${tip}" class="${s.action===v?"on "+cls:""}" onclick="setAction('${v}')">${v}</button>`).join("")+`</div>`;
  if(s.action==="RENAME"||s.action==="MERGE"){
    h+=`<div class="sub">`;
    if(s.action==="RENAME")h+=`<div class="kv"><span class="k">new id/name</span>
      <input type="text" value="${esc(s.new_id)}" placeholder="new-kebab-id / New name" oninput="st[${cur}].new_id=this.value;save()"></div>`;
    if(s.action==="MERGE"){h+=`<div class="kv"><span class="k">merge into</span>
      <select onchange="st[${cur}].merge_target=this.value;save()"><option value="">— pick target —</option>`+
      CATS.filter(x=>x.id!==c.id).map(x=>`<option value="${esc(x.id)}" ${s.merge_target===x.id?"selected":""}>${esc(x.id)}</option>`).join("")+`</select></div>`;}
    h+=`</div>`;}
  h+=`<textarea placeholder="Reason / edit notes (required for anything other than ACCEPT)" oninput="st[${cur}].note=this.value;save()">${esc(s.note)}</textarea>`;
  // category definition
  h+=`<div class="sec">Definition</div><div class="card">
    <div class="kv"><span class="k">name</span><span>${esc(c.name)}</span></div>
    <div class="kv"><span class="k">mechanism</span><span>${esc(c.mechanism)}</span></div>
    <div class="kv"><span class="k">definition</span><span>${esc(c.definition)}</span></div>
    <div class="kv"><span class="k">inclusion</span><span>${esc(c.inclusion)}</span></div>
    <div class="kv"><span class="k">exclusion</span><span>${esc(c.exclusion)}</span></div>
    <div class="kv"><span class="k">boundary</span><span>${esc(c.boundary)}</span></div></div>`;
  // anchors (provenance)
  h+=`<div class="sec">Anchors — Phase-1 provenance (derivation units)</div>`;
  if(!c.anchors.length)h+=`<div style="color:var(--mut);font-size:12.5px;">(residual-other: no anchors expected)</div>`;
  c.anchors.forEach(a=>{
    const fw=a.in_derivation?`<span class="chip c-grn">&#10003; derivation</span>`:`<span class="chip c-red">&#10007; NOT in derivation</span>`;
    const vch=a.verdict==="attributed"?"c-att":"c-amb";
    h+=`<div class="anchor"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;">
      <span class="uid">${esc(a.unit_id)}</span><span>${fw} <span class="chip ${vch}">${a.verdict}</span></span></div>
      <div style="font-size:12px;color:var(--mut);margin-top:4px;">anchor note: ${esc(a.note)}</div>
      <div style="margin-top:5px;">${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <pre>${esc(a.summary||"(no summary)")}</pre></div>`;});
  h+=nav();
  return h;
}

function mapScreen(){
  let h=`<h2 class="id">Old&rarr;new mapping &amp; four-family</h2>`;
  h+=`<div class="sec">Old (7 historical) &rarr; new mapping</div><table>
    <tr><th>#</th><th>Historical category</th><th>Empirical counterpart</th></tr>`+
    MAP.map(r=>`<tr><td>${esc(r.num)}</td><td>${esc(r.historical)}</td><td>${esc(r.counterpart)}</td></tr>`).join("")+`</table>`;
  h+=`<textarea placeholder="Comment on the old→new mapping (optional)" oninput="extra.map_comment=this.value;save()">${esc(extra.map_comment)}</textarea>`;
  h+=`<div class="sec">Four-family assessment</div><div class="card" style="white-space:pre-wrap;font-size:12.5px;line-height:1.55;">${esc(FOURFAMILY)}</div>`;
  h+=`<textarea placeholder="Comment on the four-family assessment (optional)" oninput="extra.ff_comment=this.value;save()">${esc(extra.ff_comment)}</textarea>`;
  h+=nav();return h;
}

function submitScreen(){
  const ruledN=st.filter((_,i)=>ruled(i)).length;
  const nonAccept=st.filter(s=>s.action&&s.action!=="ACCEPT");
  let h=`<h2 class="id">Overall codebook ruling</h2>`;
  h+=`<div class="card"><div class="kv"><span class="k">categories</span><span>${N} (${ruledN} ruled)</span></div>
    <div class="kv"><span class="k">non-ACCEPT</span><span>${nonAccept.length} (${nonAccept.map(s=>"").length?"":""}${st.map((s,i)=>s.action&&s.action!=="ACCEPT"?CATS[i].id+"="+s.action:null).filter(Boolean).join(", ")||"none"})</span></div>
    <div class="kv"><span class="k">G2 machine</span><span class="ok">(i)(ii)(iii) PASS — see phase2/g2_eval.md</span></div></div>`;
  if(ruledN<N)h+=`<div class="warn">&#9888; ${N-ruledN} category(ies) not yet ruled.</div>`;
  h+=`<div class="sec">Escape-hatch stratum acknowledgment</div>
    <div class="card" style="font-size:12.5px;">The codebook covers the <b>60 attributed</b> derivation units only. The
    <b>105 escape-hatch</b> units (56 indeterminate / 46 none-identified / 3 flaky-suspect) are the
    first-class <b>not-cleanly-merge-attributable</b> stratum reported in FINDINGS — no categories were invented for them.
    <label style="display:block;margin-top:8px;"><input type="checkbox" ${extra.escape_ack?"checked":""} onchange="extra.escape_ack=this.checked;save()"> I acknowledge this framing.</label></div>`;
  h+=`<div class="labels"><span style="color:var(--mut);font-size:12px;">Codebook ruling:</span>
    <button class="${extra.overall==="APPROVE"?"on on-acc":""}" onclick="setOverall('APPROVE')">APPROVE (freeze as ruled)</button>
    <button class="${extra.overall==="REVISE"?"on on-edit":""}" onclick="setOverall('REVISE')">REVISE (one Fable-5 round)</button></div>`;
  h+=`<textarea placeholder="Overall note / instructions for the freeze or revision" oninput="extra.overall_note=this.value;save()">${esc(extra.overall_note)}</textarea>`;
  h+=`<div style="margin-top:14px;display:flex;gap:8px;"><button onclick="exportJson()">Download rulings JSON</button>
    <button onclick="copyBlock()">Copy summary for Claude</button></div>`;
  h+=nav();return h;
}

function nav(){return `<div class="nav"><button onclick="go(cur-1)">&larr; Prev</button>
  <button onclick="go(cur+1)">Next &rarr;</button></div>`;}
function renderMain(){
  document.getElementById("main").innerHTML =
    cur<N?catScreen():(cur===N?mapScreen():submitScreen());
}
function render(){renderList();renderMain();}
function go(i){if(i<0||i>N+1)return;cur=i;render();document.getElementById("main").scrollTop=0;}
function setAction(v){st[cur].action=(st[cur].action===v?null:v);save();render();}
function setOverall(v){extra.overall=(extra.overall===v?null:v);save();render();}
function rulingLines(){return CATS.map((c,i)=>{const s=st[i];
  let x=`${c.id} => ${s.action||"UNRULED"}`;
  if(s.action==="RENAME"&&s.new_id)x+=` [new: ${s.new_id}]`;
  if(s.action==="MERGE"&&s.merge_target)x+=` [into: ${s.merge_target}]`;
  if(s.note)x+=` | ${s.note}`;return x;});}
function exportJson(){
  const o={meta:META,categories:CATS.map((c,i)=>({id:c.id,size:SIZES[c.id]||0,ruling:st[i]})),
    mapping_comment:extra.map_comment,four_family_comment:extra.ff_comment,
    escape_ack:extra.escape_ack,overall:extra.overall,overall_note:extra.overall_note};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));
  a.download="g2_codebook_rulings.json";a.click();}
function exportCsv(){
  const rows=[["category","size","action","new_id","merge_target","note"]].concat(
    CATS.map((c,i)=>[c.id,SIZES[c.id]||0,st[i].action||"UNRULED",st[i].new_id||"",st[i].merge_target||"",st[i].note||""]));
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="g2_codebook_rulings.csv";a.click();}
function copyBlock(){
  const nonAccept=CATS.map((c,i)=>st[i].action&&st[i].action!=="ACCEPT"?c.id+"="+st[i].action:null).filter(Boolean);
  const txt="Phase-2 codebook G2(iv) ruling (via mapping_ui.html).\n"
    +"Overall: "+(extra.overall||"UNSET")+(extra.overall_note?"  — "+extra.overall_note:"")+"\n"
    +"Escape-hatch framing acknowledged: "+(extra.escape_ack?"yes":"NO")+"\n"
    +"Non-ACCEPT categories: "+(nonAccept.join(", ")||"none")+"\n\n"
    +"Per-category rulings:\n"+rulingLines().join("\n")
    +(extra.map_comment?"\n\nMapping comment: "+extra.map_comment:"")
    +(extra.ff_comment?"\n\nFour-family comment: "+extra.ff_comment:"")
    +"\n\nNext for Claude: if APPROVE -> apply rulings, write codebook_frozen.md + fill "
    +"prompts_taxonomy/phase3_output.schema.json category enum, and make the single FREEZE COMMIT "
    +"(record in manifest). If REVISE -> one Fable-5 revision round pre-freeze.";
  navigator.clipboard.writeText(txt).then(()=>alert("Copied — paste to Claude Code."));}
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1);});
render();
</script></body></html>
